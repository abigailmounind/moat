<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900.45" viewBox="0 0 390 900.45"><title>S-B｜多选模板</title><rect width="390" height="900.45" fill="white" stroke="#bbbbbb"/><g fill="#292929" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="24" y="40" font-size="12" font-weight="400">正在了解你 · 生存 ●●●○○</text><text x="24" y="78.6" font-size="14" font-weight="400">‹ 返回</text><text x="24" y="130.3" font-size="26" font-weight="700">最近哪些事情最让你卡住？</text><text x="24" y="177.6" font-size="15" font-weight="400">最多选 3 个</text><rect x="24" y="203.85" width="342" height="52" rx="5" fill="#ffffff" stroke="#999999"/><text x="195" y="235.85" text-anchor="middle" font-size="14" fill="#292929">□ 不知道该走哪条路</text><rect x="24" y="269.85" width="342" height="52" rx="5" fill="#ffffff" stroke="#999999"/><text x="195" y="301.85" text-anchor="middle" font-size="14" fill="#292929">□ 有几个方向，选不出来</text><rect x="24" y="335.85" width="342" height="52" rx="5" fill="#ffffff" stroke="#999999"/><text x="195" y="367.85" text-anchor="middle" font-size="14" fill="#292929">□ 现在的路越来越不想继续</text><rect x="24" y="401.85" width="342" height="52" rx="5" fill="#ffffff" stroke="#999999"/><text x="195" y="433.85" text-anchor="middle" font-size="14" fill="#292929">□ 想转行，但担心成本</text><rect x="24" y="467.85" width="342" height="52" rx="5" fill="#ffffff" stroke="#999999"/><text x="195" y="499.85" text-anchor="middle" font-size="14" fill="#292929">□ 感觉会很多，却没有明显优势</text><rect x="24" y="533.85" width="342" height="52" rx="5" fill="#ffffff" stroke="#999999"/><text x="195" y="565.85" text-anchor="middle" font-size="14" fill="#292929">□ 收入 / 稳定让我焦虑</text><rect x="24" y="599.85" width="342" height="52" rx="5" fill="#ffffff" stroke="#999999"/><text x="195" y="631.85" text-anchor="middle" font-size="14" fill="#292929">□ 努力很久，感觉没形成积累</text><rect x="24" y="665.85" width="342" height="52" rx="5" fill="#ffffff" stroke="#999999"/><text x="195" y="697.85" text-anchor="middle" font-size="14" fill="#292929">□ 说不上来，就是有点迷茫</text><rect x="24" y="731.85" width="342" height="52" rx="5" fill="#ffffff" stroke="#999999"/><text x="195" y="763.85" text-anchor="middle" font-size="14" fill="#292929">□ ＋ 其他</text><rect x="24" y="797.85" width="342" height="52" rx="5" fill="#dddddd" stroke="#999999"/><text x="195" y="829.85" text-anchor="middle" font-size="14" fill="#292929">继续</text><text x="24" y="875.85" font-size="12" font-weight="400">已选 0 / 3 · 探索进度不代表评分</text></g></svg>