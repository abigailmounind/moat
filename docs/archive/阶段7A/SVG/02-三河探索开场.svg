<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>S01｜三河探索开场</title><rect width="390" height="844" fill="white" stroke="#bbbbbb"/><g fill="#292929" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="24" y="40" font-size="12" font-weight="400">人生三河</text><text x="24" y="78.6" font-size="14" font-weight="400">‹ 返回</text><text x="24" y="130.3" font-size="26" font-weight="700">不用把人生想明白再开始。</text><text x="24" y="177.6" font-size="15" font-weight="400">看到接近自己的选项，点它就好。有些问题我们会</text><text x="24" y="200.85" font-size="15" font-weight="400">根据前面的回答形成初步理解，请你确认。</text><rect x="24" y="227.1" width="342" height="86.04999999999998" fill="#f4f4f4"/><text x="40" y="260.1" font-size="17" font-weight="700">约几分钟</text><text x="40" y="289.45" font-size="14" font-weight="400">没有标准答案 · 可以返回修改</text><rect x="24" y="331.15" width="342" height="86.05000000000001" fill="#f4f4f4"/><text x="40" y="364.15" font-size="17" font-weight="700">由你决定回答多少</text><text x="40" y="393.5" font-size="14" font-weight="400">敏感问题可以跳过，长期保存由你决定。</text><rect x="24" y="435.2" width="342" height="86.05000000000001" fill="#f4f4f4"/><text x="40" y="468.2" font-size="17" font-weight="700">接下来</text><text x="40" y="497.55" font-size="14" font-weight="400">梳理现状 → 确认理解 → 看见三河</text><rect x="24" y="539.25" width="342" height="52" rx="5" fill="#292929" stroke="#999999"/><text x="195" y="571.25" text-anchor="middle" font-size="14" fill="#ffffff">开始探索</text><text x="24" y="617.25" font-size="12" font-weight="400">人生三河 · 中文低保真体验稿</text></g></svg>