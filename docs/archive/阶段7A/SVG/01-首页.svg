<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>L01｜首页</title><rect width="390" height="844" fill="white" stroke="#bbbbbb"/><g fill="#292929" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="24" y="40" font-size="12" font-weight="400">人生三河</text><text x="24" y="90.6" font-size="26" font-weight="700">最近有点卡住？</text><text x="24" y="130.9" font-size="26" font-weight="700">先看看你的人生三条河流到哪</text><text x="24" y="171.20000000000002" font-size="26" font-weight="700">了。</text><text x="24" y="218.50000000000003" font-size="15" font-weight="400">看见你正在拥有的，也看见下一步可以去哪里。</text><text x="24" y="259.75" font-size="15" font-weight="400">用几分钟梳理你已经拥有的能力、资源和选择，看</text><text x="24" y="283" font-size="15" font-weight="400">清当前状态、关键断点和下一步值得探索的方向。</text><rect x="24" y="309.25" width="342" height="52" rx="5" fill="#ffffff" stroke="#999999"/><text x="195" y="341.25" text-anchor="middle" font-size="14" fill="#292929">先了解一下</text><rect x="24" y="375.25" width="342" height="151.14999999999998" fill="#f4f4f4"/><text x="40" y="408.25" font-size="17" font-weight="700">你会得到什么</text><text x="40" y="437.6" font-size="14" font-weight="400">三河状态：生存、韧性与意义</text><text x="40" y="459.3" font-size="14" font-weight="400">关键断点：找到最值得投入的一环</text><text x="40" y="481" font-size="14" font-weight="400">未来路径：复用已有积累</text><text x="40" y="502.7" font-size="14" font-weight="400">下一步：可以开始的小行动</text><rect x="24" y="544.4" width="342" height="129.45000000000016" fill="#f4f4f4"/><text x="40" y="577.4" font-size="17" font-weight="700">为什么值得试</text><text x="40" y="606.75" font-size="14" font-weight="400">少写一点：大多数问题点选完成</text><text x="40" y="628.45" font-size="14" font-weight="400">看真实积累：考虑经历、成果和资源</text><text x="40" y="650.1500000000001" font-size="14" font-weight="400">隐私由你掌控：敏感问题可跳过</text><rect x="24" y="691.8500000000001" width="342" height="52" rx="5" fill="#292929" stroke="#999999"/><text x="195" y="723.8500000000001" text-anchor="middle" font-size="14" fill="#ffffff">开始三河探索</text><text x="24" y="769.8500000000001" font-size="12" font-weight="400">人生三河 · 中文低保真体验稿</text></g></svg>