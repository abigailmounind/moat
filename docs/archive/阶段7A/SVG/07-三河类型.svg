<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>R01｜三河类型</title><rect width="390" height="844" fill="white" stroke="#bbbbbb"/><g fill="#292929" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="24" y="40" font-size="12" font-weight="400">结果探索 · 1 / 6 · 演示数据</text><text x="24" y="78.6" font-size="14" font-weight="400">‹ 返回</text><text x="24" y="130.3" font-size="26" font-weight="700">河网形成型</text><text x="24" y="177.6" font-size="15" font-weight="400">你已经形成几条有价值的能力和经历支流，下一阶</text><text x="24" y="200.85" font-size="15" font-weight="400">段值得重点加强它们之间的连接。</text><rect x="24" y="227.1" width="342" height="86.04999999999998" fill="#f4f4f4"/><text x="40" y="260.1" font-size="17" font-weight="700">生存河 · 72%</text><text x="40" y="289.45" font-size="14" font-weight="400">当前生活的持续支撑</text><rect x="24" y="331.15" width="342" height="86.05000000000001" fill="#f4f4f4"/><text x="40" y="364.15" font-size="17" font-weight="700">韧性河 · 48%</text><text x="40" y="393.5" font-size="14" font-weight="400">变化来临时的缓冲与选择</text><rect x="24" y="435.2" width="342" height="86.05000000000001" fill="#f4f4f4"/><text x="40" y="468.2" font-size="17" font-weight="700">意义河 · 67%</text><text x="40" y="497.55" font-size="14" font-weight="400">方向与个人偏好的连接</text><text x="24" y="554.25" font-size="15" font-weight="400">积累正在形成 · 证明偏弱 · 方向逐渐清晰</text><rect x="24" y="580.5" width="342" height="52" rx="5" fill="#292929" stroke="#999999"/><text x="195" y="612.5" text-anchor="middle" font-size="14" fill="#ffffff">继续看看</text><text x="24" y="658.5" font-size="12" font-weight="400">这是当前状态，会随着经历和选择变化。</text></g></svg>