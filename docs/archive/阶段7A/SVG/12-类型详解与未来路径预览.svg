<svg xmlns="http://www.w3.org/2000/svg" width="390" height="871.4500000000002" viewBox="0 0 390 871.4500000000002"><title>R06｜类型详解与未来路径预览</title><rect width="390" height="871.4500000000002" fill="white" stroke="#bbbbbb"/><g fill="#292929" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="24" y="40" font-size="12" font-weight="400">结果探索 · 6 / 6 · 演示数据</text><text x="24" y="78.6" font-size="14" font-weight="400">‹ 返回</text><text x="24" y="130.3" font-size="26" font-weight="700">让能力、证明和选择权连接起</text><text x="24" y="170.6" font-size="26" font-weight="700">来。</text><rect x="24" y="202.9" width="342" height="107.74999999999997" fill="#f4f4f4"/><text x="40" y="235.9" font-size="17" font-weight="700">河网形成型 · 你的优势</text><text x="40" y="265.25" font-size="14" font-weight="400">多项能力开始形成组合</text><text x="40" y="286.95" font-size="14" font-weight="400">已有积累具备跨方向迁移潜力</text><rect x="24" y="328.65" width="342" height="129.45" fill="#f4f4f4"/><text x="40" y="361.65" font-size="17" font-weight="700">当前风险</text><text x="40" y="391" font-size="14" font-weight="400">证明与能力积累不同步</text><text x="40" y="412.7" font-size="14" font-weight="400">多条支流分散发展</text><text x="40" y="434.4" font-size="14" font-weight="400">选择空间尚未充分打开</text><rect x="24" y="476.09999999999997" width="342" height="86.05000000000001" fill="#f4f4f4"/><text x="40" y="509.09999999999997" font-size="17" font-weight="700">下一阶段</text><text x="40" y="538.4499999999999" font-size="14" font-weight="400">能力 → 证明 → 选择权</text><rect x="24" y="580.15" width="342" height="129.45000000000016" fill="#f4f4f4"/><text x="40" y="613.15" font-size="17" font-weight="700">接下来，有几条路值得看看</text><text x="40" y="642.5" font-size="14" font-weight="400">加固当前方向 · 资本复用 86%</text><text x="40" y="664.2" font-size="14" font-weight="400">相邻迁移 · 资本复用 73%</text><text x="40" y="685.9000000000001" font-size="14" font-weight="400">低成本探索 · 意义匹配 89%</text><text x="24" y="742.6000000000001" font-size="15" font-weight="400">把这些方向保存下来，慢慢选。</text><rect x="24" y="768.8500000000001" width="342" height="52" rx="5" fill="#292929" stroke="#999999"/><text x="195" y="800.8500000000001" text-anchor="middle" font-size="14" fill="#ffffff">建立我的护城河</text><text x="24" y="846.8500000000001" font-size="12" font-weight="400">路径为探索建议，由你决定是否继续。</text></g></svg>