<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>R02｜核心判断</title><rect width="390" height="844" fill="white" stroke="#bbbbbb"/><g fill="#292929" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="24" y="40" font-size="12" font-weight="400">结果探索 · 2 / 6 · 演示数据</text><text x="24" y="78.6" font-size="14" font-weight="400">‹ 返回</text><text x="24" y="130.3" font-size="26" font-weight="700">现在的我，</text><text x="24" y="170.6" font-size="26" font-weight="700">最应该知道什么？</text><rect x="24" y="202.9" width="342" height="107.74999999999997" fill="#f4f4f4"/><text x="40" y="235.9" font-size="17" font-weight="700">你已经拥有</text><text x="40" y="265.25" font-size="14" font-weight="400">能力资本积累较好，已有项目和研究经历可以继续</text><text x="40" y="286.95" font-size="14" font-weight="400">转化。</text><rect x="24" y="328.65" width="342" height="107.75" fill="#f4f4f4"/><text x="40" y="361.65" font-size="17" font-weight="700">当前最卡的</text><text x="40" y="391" font-size="14" font-weight="400">证明资本为 43%，已有能力还缺少更强的作品、</text><text x="40" y="412.7" font-size="14" font-weight="400">结果和外部验证。</text><rect x="24" y="454.4" width="342" height="107.75000000000011" fill="#f4f4f4"/><text x="40" y="487.4" font-size="17" font-weight="700">现在最值得做的</text><text x="40" y="516.75" font-size="14" font-weight="400">优先把已有能力转化成 1–2 个可以被别人直接</text><text x="40" y="538.45" font-size="14" font-weight="400">看见的成果。</text><rect x="24" y="580.1500000000001" width="342" height="52" rx="5" fill="#292929" stroke="#999999"/><text x="195" y="612.1500000000001" text-anchor="middle" font-size="14" fill="#ffffff">看看我的三河地图</text><text x="24" y="658.1500000000001" font-size="12" font-weight="400">人生三河 · 中文低保真体验稿</text></g></svg>