let current=0,one=null,multi=new Set(),kept=[true,true,true],extra=[],confirmed=[false,false,false],edits={},selectedRiver=0,loadingTimer;
const root=document.querySelector('main'),nav=document.querySelector('nav');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function go(i){clearTimeout(loadingTimer);current=i;render();window.scrollTo(0,0)}
function btn(label,action,cls='secondary',disabled=false){return '<button class="'+cls+'" onclick="'+action+'" '+(disabled?'disabled':'')+'>'+esc(label)+'</button>'}
function card(t,b){return '<section class="card"><h3>'+esc(t)+'</h3><p>'+esc(b||'')+'</p></section>'}
function openDialog(html){const d=document.querySelector('dialog');d.innerHTML=html;d.showModal()}
function closeDialog(){document.querySelector('dialog').close()}
function edit(kind,index){openDialog('<h3>'+(kind==='profile'?'哪里需要改一下？':'补充你的信息')+'</h3>'+(kind==='profile'?['说得太重了','说得太轻了','方向理解错了','漏了重要信息'].map(s=>btn(s,"document.querySelector('textarea').value='"+s+"'",'option')).join(''):'')+'<label>我自己补充<textarea placeholder="写一句就好"></textarea></label>'+btn('确认修改',"applyEdit('"+kind+"',"+index+")",'primary')+btn('取消','closeDialog()'))}
function applyEdit(kind,index){const value=document.querySelector('textarea').value.trim();if(!value){document.querySelector('textarea').placeholder='请先写一句补充';return}if(kind==='profile'){edits[index]=value;confirmed[index]=true}else if(kind==='tag'){extra.push(value)}else{if(!multi.has(8)&&multi.size>=3){document.querySelector('textarea').value='';document.querySelector('textarea').placeholder='已选3项，请取消一项后再补充';return}window.other=value;multi.add(8)}closeDialog();render()}
function choose(i){one=i;render()}
function toggle(i){if(multi.has(i))multi.delete(i);else if(multi.size<3)multi.add(i);else{openDialog('<h3>最多选 3 个</h3><p>先取消一个选项，再选择新的。</p>'+btn('知道了','closeDialog()','primary'));return}render()}
function generate(fail=false){root.innerHTML='<div class="loading"><span class="tag">AI 理解确认</span><h2>正在把这些支流连起来……</h2><p>整理你的已有积累 ✓</p><p>看看三条河的状态 ✓</p><p>寻找目前的关键断点 …</p><progress></progress><p class="foot">原型演示，不会调用 AI 或上传你的输入。</p>'+btn('查看生成失败状态','generate(true)')+'</div>';loadingTimer=setTimeout(()=>{if(fail){root.innerHTML='<h2>这次没能连起来。</h2><p>你确认的内容还在本次体验中，可以重试。</p>'+btn('重新生成','generate()','primary')+btn('返回修改','go(5)')}else go(6)},fail?0:1300)}
function saveGate(){openDialog('<h3>下一阶段：建立我的护城河</h3><p>这里将选择保存范围，再注册或登录。本轮线框体验到此结束，未保存任何账户数据。</p>'+btn('返回结果','closeDialog()','primary'))}
function render(){const d=data[current];nav.innerHTML=data.map((x,i)=>'<button class="'+(i===current?'active':'')+'" onclick="go('+i+')">'+(i+1)+'. '+esc(x.name.split('｜').pop())+'</button>').join('');let h='<div class="top">'+(current?btn('‹ 返回','go('+(current-1)+')','back'):'<span>人生三河</span>')+'<span>'+esc(d.top||'三河探索')+'</span></div><h2>'+esc(d.title)+'</h2>'+(d.desc?'<p>'+esc(d.desc)+'</p>':'');
if(current===2){h+=d.items.map((x,i)=>btn((one===i?'● ':'○ ')+x.text.replace(/^○ /,''),'choose('+i+')','option '+(one===i?'selected':''))).join('');h+=btn('继续','go(3)','primary',one===null)}
else if(current===3){h+=d.items.map((x,i)=>btn((multi.has(i)?'☑ ':'□ ')+(i===8?(window.other||'其他，我自己说'):x.text.replace(/^□ /,'')),i===8?"edit('other',8)":'toggle('+i+')','option '+(multi.has(i)?'selected':''))).join('');h+='<p class="tag">已选 '+multi.size+' / 3</p>';h+=btn('继续','go(4)','primary',multi.size===0);h+=btn('暂时跳过','go(4)')}
else if(current===4){const cards=d.items.filter(x=>x.title);h+=cards.map((x,i)=>'<section class="card"><h3 class="'+(!kept[i]?'muted':'')+'">'+esc(x.title)+'</h3><p>'+esc(x.body)+'</p><div class="actions">'+btn(kept[i]?'✓ 保留':'保留','kept['+i+']=true;render()')+btn(kept[i]?'删除':'已删除','kept['+i+']=false;render()')+'</div></section>').join('');h+=extra.map(x=>card(x,'由你补充')).join('');h+=btn('＋ 补一个',"edit('tag',0)");h+=btn('确认这些积累','go(5)','primary')}
else if(current===5){h+=d.items.filter(x=>x.title).map((x,i)=>'<section class="card"><h3>'+esc(x.title)+'</h3><p>'+esc(edits[i]||x.body)+'</p><div class="actions">'+btn(confirmed[i]?'✓ 挺准的':'挺准的','confirmed['+i+']=true;render()')+btn('调整一下',"edit('profile',"+i+")")+'</div></section>').join('');h+=btn('差不多就是这样，看看三条河','confirmed=[true,true,true];generate()','primary');h+=btn('我还想改一下',"edit('profile',0)")}
else if(current===8){h+='<svg class="river" viewBox="0 0 342 220" aria-label="三条河的信息关系示意"><path d="M171 65V110L85 166M171 110L260 166" fill="none" stroke="#999" stroke-width="2"/><text x="171" y="32" text-anchor="middle">生存河 72%</text><text x="171" y="110" text-anchor="middle" fill="#333">当前的你</text><text x="80" y="200" text-anchor="middle">韧性河 48%</text><text x="262" y="200" text-anchor="middle">意义河 67%</text></svg>';h+=['生存河 72% · 稳定，有持续供水','韧性河 48% · 最值得建设','意义河 67% · 方向逐渐清晰'].map((t,i)=>btn(t,'river('+i+')','option')).join('');h+=card('当前最稳 / 最值得建设','生存河 72% / 韧性河 48%');h+=btn('查看三河 × 五资本详情','go(9)','primary')}
else if(current===9){h+='<div class="actions">'+['生存河','韧性河','意义河'].map((t,i)=>btn(t,'selectedRiver='+i+';render()',i===selectedRiver?'secondary selected':'secondary')).join('')+'</div>';h+=card('当前查看：'+['生存河','韧性河','意义河'][selectedRiver],'五资本结构占位');h+=['能力资本','证明资本','关系资本','资源资本','选择权资本'].map(t=>card(t,'待展开')).join('');h+=card('资本详情内容占位','已经拥有 / 当前缺口 / 判断依据');h+=btn('继续看看关键断点','go(10)','primary')}
else{h+=d.items.map(x=>x.kind==='text'?'<p>'+esc(x.text)+'</p>':x.kind==='button'?btn(x.text,'go(1)',x.name==='开始'?'primary':'secondary'):'<div '+(x.title==='你会得到什么'?'id="learn"':'')+'>'+card(x.title,x.body)+'</div>').join('');if(d.cta)h+=btn(d.cta,current===data.length-1?'saveGate()':'go('+(current+1)+')','primary')}
if(d.designNote)h+='<aside class="design-note"><strong>设计备注</strong><p>'+esc(d.designNote)+'</p></aside>';h+='<p class="foot">'+esc(d.footer||'敏感问题可以跳过，长期保存由你决定。')+'</p>';root.innerHTML=h}
