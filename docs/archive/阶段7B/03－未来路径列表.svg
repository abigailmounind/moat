<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 3</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 返回</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">未来不需要一次选死</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">把值得考虑的路放在这里，慢慢验证。</text><text x="24" y="170" font-size="12" font-weight="400" fill="#666">由人工智能初始化，你可以持续调整。</text><g id="区块-194"><rect x="24" y="194" width="342" height="142" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="223" font-size="16" font-weight="600" fill="#333">人工智能产品经理 · 重点探索</text><text x="40" y="251" font-size="13" font-weight="400" fill="#333">资本复用 81%　　意义匹配 84%</text><text x="40" y="276" font-size="13" font-weight="400" fill="#333">已有相关能力，证明资本还需加强。</text><text x="40" y="301" font-size="13" font-weight="400" fill="#333">查看路径 ›</text></g><g id="区块-353"><rect x="24" y="353" width="342" height="142" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="382" font-size="16" font-weight="600" fill="#333">独立开发 · 低成本探索</text><text x="40" y="410" font-size="13" font-weight="400" fill="#333">资本复用 63%　　意义匹配 91%</text><text x="40" y="435" font-size="13" font-weight="400" fill="#333">先用小项目检验兴趣与投入。</text><text x="40" y="460" font-size="13" font-weight="400" fill="#333">查看路径 ›</text></g><g id="区块-512"><rect x="24" y="512" width="342" height="142" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="541" font-size="16" font-weight="600" fill="#333">人工智能工程 · 暂时保留</text><text x="40" y="569" font-size="13" font-weight="400" fill="#333">资本复用 72%　　意义匹配 59%</text><text x="40" y="594" font-size="13" font-weight="400" fill="#333">保留方向，暂不安排推进任务。</text><text x="40" y="619" font-size="13" font-weight="400" fill="#333">查看路径 ›</text></g><g id="按钮-680"><rect x="24" y="680" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="139" y="709" font-size="14" font-weight="600" fill="#fff">＋ 新建一条路径</text></g><text x="24" y="752" font-size="12" font-weight="400" fill="#666">每条路径都支持编辑、暂停与删除。</text><text x="24" y="773" font-size="12" font-weight="400" fill="#666">指标的含义与依据可在路径详情中查看。</text><g id="底部导航"><rect x="0" y="978" width="390" height="62" rx="0" fill="#fff" stroke="#ddd"/><text x="16" y="1014" font-size="12" font-weight="400" fill="#888">我的河</text><text x="114" y="1014" font-size="12" font-weight="600" fill="#222">未来路径</text><text x="212" y="1014" font-size="12" font-weight="400" fill="#888">护城河计划</text><text x="310" y="1014" font-size="12" font-weight="400" fill="#888">我的</text></g></g></svg>