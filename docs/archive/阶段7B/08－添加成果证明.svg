<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 8</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 里程碑</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">添加成果证明</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">把你做过的事情，变成看得见的积累。</text><g id="区块-174"><rect x="24" y="174" width="342" height="165" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="203" font-size="16" font-weight="600" fill="#333">第一步 · 记录成果</text><text x="40" y="231" font-size="13" font-weight="400" fill="#333">成果名称 *　五次目标用户访谈与结论</text><text x="40" y="256" font-size="13" font-weight="400" fill="#333">成果摘要 *　完成五次访谈，提炼三项需求。</text><text x="40" y="281" font-size="13" font-weight="400" fill="#333">链接 / 附件（可选）　＋ 添加</text><text x="40" y="306" font-size="13" font-weight="400" fill="#333">关联里程碑　完成五次目标用户访谈 ›</text></g><text x="24" y="363" font-size="12" font-weight="400" fill="#666">默认仅保存摘要；附件由你主动选择。</text><text x="24" y="384" font-size="12" font-weight="400" fill="#666">请先移除姓名、联系方式等第三方敏感信息。</text><g id="按钮-410"><rect x="24" y="410" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="118" y="439" font-size="14" font-weight="600" fill="#333">请人工智能识别关联资本</text></g><g id="区块-475"><rect x="24" y="475" width="342" height="169" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="504" font-size="16" font-weight="600" fill="#333">第二步 · 确认识别建议</text><text x="40" y="532" font-size="13" font-weight="400" fill="#333">☑ 证明资本　有可核验的访谈结论</text><text x="40" y="557" font-size="13" font-weight="400" fill="#333">☑ 能力资本　体现用户研究与归纳能力</text><text x="40" y="582" font-size="13" font-weight="400" fill="#333">修改关联资本 ›　　补充 / 取消勾选</text><text x="40" y="607" font-size="13" font-weight="400" fill="#333">依据：本次成果摘要与已选材料</text></g><text x="24" y="670" font-size="12" font-weight="400" fill="#666">此区在识别后出现；识别结果尚未计入评分。</text><text x="24" y="691" font-size="12" font-weight="400" fill="#666">识别失败时，可重试或手动选择关联资本。</text><g id="按钮-726"><rect x="24" y="726" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="132" y="755" font-size="14" font-weight="600" fill="#fff">确认关联并更新三河</text></g><text x="24" y="802" font-size="12" font-weight="400" fill="#666">确认后保存成果，由评分系统重新计算。</text><text x="24" y="823" font-size="12" font-weight="400" fill="#666">计算期间显示处理中；失败后可重试。</text><text x="24" y="844" font-size="12" font-weight="400" fill="#666">也可以先保存草稿，之后再确认。</text><g id="按钮-889"><rect x="24" y="889" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="167" y="918" font-size="14" font-weight="600" fill="#333">保存草稿</text></g></g></svg>