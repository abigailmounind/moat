<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 9</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 成果证明</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">这份进展，已经记下来了</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">成果已保存，三河已完成更新。</text><g id="区块-175"><rect x="24" y="175" width="342" height="139" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="204" font-size="16" font-weight="600" fill="#333">本次成果</text><text x="40" y="232" font-size="13" font-weight="400" fill="#333">五次目标用户访谈与结论</text><text x="40" y="257" font-size="13" font-weight="400" fill="#333">你已确认：证明资本、能力资本</text><text x="40" y="282" font-size="13" font-weight="400" fill="#333">已计入本次更新　　查看成果 ›</text></g><g id="区块-331"><rect x="24" y="331" width="342" height="142" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="360" font-size="16" font-weight="600" fill="#333">三河变化</text><text x="40" y="388" font-size="13" font-weight="400" fill="#333">生存河　72% → 72%　持平</text><text x="40" y="413" font-size="13" font-weight="400" fill="#333">韧性河　51% → 53%　↑ 2 个百分点</text><text x="40" y="438" font-size="13" font-weight="400" fill="#333">意义河　67% → 67%　持平</text></g><g id="区块-490"><rect x="24" y="490" width="342" height="164" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="519" font-size="16" font-weight="600" fill="#333">这次更新说明了什么</text><text x="40" y="547" font-size="13" font-weight="400" fill="#333">访谈结论补充了可核验成果，</text><text x="40" y="572" font-size="13" font-weight="400" fill="#333">提升了证明资本对应的评估。</text><text x="40" y="597" font-size="13" font-weight="400" fill="#333">生存河与意义河暂未出现有效变化。</text><text x="40" y="622" font-size="13" font-weight="400" fill="#333">查看本次评分依据 ›</text></g><g id="区块-671"><rect x="24" y="671" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="700" font-size="16" font-weight="600" fill="#333">接下来的一小步</text><text x="40" y="728" font-size="13" font-weight="400" fill="#333">访谈里程碑已完成。</text><text x="40" y="753" font-size="13" font-weight="400" fill="#333">下一步：制作并测试一个小原型。</text></g><g id="按钮-809"><rect x="24" y="809" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="160" y="838" font-size="14" font-weight="600" fill="#fff">回到我的河</text></g><g id="按钮-868"><rect x="24" y="868" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="146" y="897" font-size="14" font-weight="600" fill="#333">查看下一里程碑</text></g><text x="24" y="946" font-size="12" font-weight="400" fill="#666">每份成果都能留下记录；分数也可能保持不变。</text></g></svg>