<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 5</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 路径详情</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">新建 / 编辑路径</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">先写下方向，之后随时可以调整。</text><g id="区块-175"><rect x="24" y="175" width="342" height="86" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="204" font-size="16" font-weight="600" fill="#333">路径名称 *</text><text x="40" y="232" font-size="13" font-weight="400" fill="#333">人工智能产品经理</text></g><g id="区块-276"><rect x="24" y="276" width="342" height="88" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="305" font-size="16" font-weight="600" fill="#333">为什么想试试（可选）</text><text x="40" y="333" font-size="13" font-weight="400" fill="#333">希望把技术理解变成有人使用的产品。</text></g><g id="区块-379"><rect x="24" y="379" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="408" font-size="16" font-weight="600" fill="#333">探索状态</text><text x="40" y="436" font-size="13" font-weight="400" fill="#333">● 重点探索　　○ 低成本探索</text><text x="40" y="461" font-size="13" font-weight="400" fill="#333">○ 暂时保留　　○ 已暂停</text></g><g id="区块-506"><rect x="24" y="506" width="342" height="89" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="535" font-size="16" font-weight="600" fill="#333">准备怎样验证（可选）</text><text x="40" y="563" font-size="13" font-weight="400" fill="#333">完成五次访谈，再制作一个小原型。</text></g><text x="24" y="621" font-size="12" font-weight="400" fill="#666">可用人工智能补充建议，再自行修改。</text><text x="24" y="642" font-size="12" font-weight="400" fill="#666">个人收入等敏感信息无需填写。</text><g id="按钮-675"><rect x="24" y="675" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="167" y="704" font-size="14" font-weight="600" fill="#fff">保存路径</text></g><g id="按钮-733"><rect x="24" y="733" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="132" y="762" font-size="14" font-weight="600" fill="#333">请人工智能补充建议</text></g><g id="区块-807"><rect x="24" y="807" width="342" height="111" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="836" font-size="16" font-weight="600" fill="#333">管理已有路径</text><text x="40" y="864" font-size="13" font-weight="400" fill="#333">暂停路径　›　保留记录，暂停推进提醒</text><text x="40" y="889" font-size="13" font-weight="400" fill="#333">删除路径　›　确认后删除，成果证明保留</text></g><text x="24" y="947" font-size="12" font-weight="400" fill="#666">新建时不显示管理区；返回未保存时提示保留草稿。</text></g></svg>