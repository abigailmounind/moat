<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 4</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 未来路径</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">人工智能产品经理</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">重点探索　　　　　　　　　编辑路径 ›</text><g id="区块-171"><rect x="24" y="171" width="342" height="114" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="200" font-size="16" font-weight="600" fill="#333">为什么值得考虑</text><text x="40" y="228" font-size="13" font-weight="400" fill="#333">可复用你的人工智能技术理解、</text><text x="40" y="253" font-size="13" font-weight="400" fill="#333">项目实践和产品探索经验。</text></g><g id="区块-301"><rect x="24" y="301" width="342" height="141" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="330" font-size="16" font-weight="600" fill="#333">四个参考指标　　查看依据 ›</text><text x="40" y="358" font-size="13" font-weight="400" fill="#333">资本复用 81%　　意义匹配 84%</text><text x="40" y="383" font-size="13" font-weight="400" fill="#333">转换成本 42%　　当前准备度 68%</text><text x="40" y="408" font-size="13" font-weight="400" fill="#333">转换成本越低，所需新增投入越少。</text></g><g id="区块-458"><rect x="24" y="458" width="342" height="115" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="487" font-size="16" font-weight="600" fill="#333">已有积累与主要缺口</text><text x="40" y="515" font-size="13" font-weight="400" fill="#333">已有：技术理解、研究能力、独立项目经验</text><text x="40" y="540" font-size="13" font-weight="400" fill="#333">缺口：真实用户研究、商业结果、行业经验</text></g><g id="区块-589"><rect x="24" y="589" width="342" height="113" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="618" font-size="16" font-weight="600" fill="#333">先这样验证</text><text x="40" y="646" font-size="13" font-weight="400" fill="#333">完成五次目标用户访谈，整理需求结论。</text><text x="40" y="671" font-size="13" font-weight="400" fill="#333">再用一个小原型检验真实使用意愿。</text></g><g id="按钮-725"><rect x="24" y="725" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="132" y="754" font-size="14" font-weight="600" fill="#fff">为这条路径制定计划</text></g><g id="按钮-783"><rect x="24" y="783" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="146" y="812" font-size="14" font-weight="600" fill="#333">编辑或管理路径</text></g><text x="24" y="860" font-size="12" font-weight="400" fill="#666">人工智能先生成可编辑计划，确认后开始推进。</text><g id="底部导航"><rect x="0" y="978" width="390" height="62" rx="0" fill="#fff" stroke="#ddd"/><text x="16" y="1014" font-size="12" font-weight="400" fill="#888">我的河</text><text x="114" y="1014" font-size="12" font-weight="600" fill="#222">未来路径</text><text x="212" y="1014" font-size="12" font-weight="400" fill="#888">护城河计划</text><text x="310" y="1014" font-size="12" font-weight="400" fill="#888">我的</text></g></g></svg>