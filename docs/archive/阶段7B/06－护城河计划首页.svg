<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 6</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 返回</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">护城河计划</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">把想走的路，拆成走得动的小步。</text><g id="区块-172"><rect x="24" y="172" width="342" height="141" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="201" font-size="16" font-weight="600" fill="#333">人工智能产品经理</text><text x="40" y="229" font-size="13" font-weight="400" fill="#333">人工智能已生成初稿，可持续编辑。</text><text x="40" y="254" font-size="13" font-weight="400" fill="#333">建设重点：证明资本　46% → 60%</text><text x="40" y="279" font-size="13" font-weight="400" fill="#333">目标是建设方向，不保证分数提升。</text></g><text x="24" y="345" font-size="16" font-weight="600" fill="#333">里程碑　　　　　　　　　编辑计划 ›</text><g id="区块-365"><rect x="24" y="365" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="394" font-size="16" font-weight="600" fill="#333">一 · 完成五次目标用户访谈</text><text x="40" y="422" font-size="13" font-weight="400" fill="#333">进行中　3 / 5　　　　　　查看详情 ›</text><text x="40" y="447" font-size="13" font-weight="400" fill="#333">关联：证明资本、能力资本</text></g><g id="区块-491"><rect x="24" y="491" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="520" font-size="16" font-weight="600" fill="#333">二 · 制作并测试一个小原型</text><text x="40" y="548" font-size="13" font-weight="400" fill="#333">待开始　　　　　　　　　编辑 ›</text><text x="40" y="573" font-size="13" font-weight="400" fill="#333">完成访谈后，调整原型范围。</text></g><g id="区块-617"><rect x="24" y="617" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="646" font-size="16" font-weight="600" fill="#333">三 · 整理一份可展示的案例</text><text x="40" y="674" font-size="13" font-weight="400" fill="#333">待开始　　　　　　　　　编辑 ›</text><text x="40" y="699" font-size="13" font-weight="400" fill="#333">用过程与结果说明自己的贡献。</text></g><g id="按钮-754"><rect x="24" y="754" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="146" y="783" font-size="14" font-weight="600" fill="#fff">继续当前里程碑</text></g><g id="按钮-813"><rect x="24" y="813" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="111" y="842" font-size="14" font-weight="600" fill="#333">编辑计划 / 添加里程碑</text></g><text x="24" y="889" font-size="12" font-weight="400" fill="#666">可调整目标、时间与里程碑顺序。</text><text x="24" y="910" font-size="12" font-weight="400" fill="#666">初次生成时，主按钮为「确认计划并开始」。</text><g id="底部导航"><rect x="0" y="978" width="390" height="62" rx="0" fill="#fff" stroke="#ddd"/><text x="16" y="1014" font-size="12" font-weight="400" fill="#888">我的河</text><text x="114" y="1014" font-size="12" font-weight="400" fill="#888">未来路径</text><text x="212" y="1014" font-size="12" font-weight="600" fill="#222">护城河计划</text><text x="310" y="1014" font-size="12" font-weight="400" fill="#888">我的</text></g></g></svg>