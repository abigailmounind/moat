<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 7</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 护城河计划</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">完成五次目标用户访谈</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">进行中　　　　　　　　　编辑里程碑 ›</text><g id="区块-175"><rect x="24" y="175" width="342" height="113" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="204" font-size="16" font-weight="600" fill="#333">这一步要完成什么</text><text x="40" y="232" font-size="13" font-weight="400" fill="#333">了解真实需求，整理一份访谈结论。</text><text x="40" y="257" font-size="13" font-weight="400" fill="#333">完成标准：五次访谈 + 一份结论摘要。</text></g><g id="区块-304"><rect x="24" y="304" width="342" height="164" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="333" font-size="16" font-weight="600" fill="#333">当前进度　3 / 5</text><text x="40" y="361" font-size="13" font-weight="400" fill="#333">☑ 已完成三次访谈</text><text x="40" y="386" font-size="13" font-weight="400" fill="#333">□ 完成剩余两次访谈</text><text x="40" y="411" font-size="13" font-weight="400" fill="#333">□ 整理结论摘要</text><text x="40" y="436" font-size="13" font-weight="400" fill="#333">调整进度 ›　　目标日期：九月十四日</text></g><g id="区块-485"><rect x="24" y="485" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="514" font-size="16" font-weight="600" fill="#333">关联资本</text><text x="40" y="542" font-size="13" font-weight="400" fill="#333">证明资本 · 能力资本</text><text x="40" y="567" font-size="13" font-weight="400" fill="#333">实际关联将在添加成果后由你确认。</text></g><g id="区块-615"><rect x="24" y="615" width="342" height="86" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="644" font-size="16" font-weight="600" fill="#333">已有成果证明</text><text x="40" y="672" font-size="13" font-weight="400" fill="#333">访谈摘要（一）　　　　　　查看 ›</text></g><g id="按钮-725"><rect x="24" y="725" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="153" y="754" font-size="14" font-weight="600" fill="#fff">添加成果证明</text></g><g id="按钮-784"><rect x="24" y="784" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="118" y="813" font-size="14" font-weight="600" fill="#333">编辑内容 / 调整日期</text></g><text x="24" y="860" font-size="12" font-weight="400" fill="#666">达到完成标准后，可标记里程碑完成。</text><text x="24" y="881" font-size="12" font-weight="400" fill="#666">完成任务本身不会直接增加三河分数。</text><g id="底部导航"><rect x="0" y="978" width="390" height="62" rx="0" fill="#fff" stroke="#ddd"/><text x="16" y="1014" font-size="12" font-weight="400" fill="#888">我的河</text><text x="114" y="1014" font-size="12" font-weight="400" fill="#888">未来路径</text><text x="212" y="1014" font-size="12" font-weight="600" fill="#222">护城河计划</text><text x="310" y="1014" font-size="12" font-weight="400" fill="#888">我的</text></g></g></svg>