<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>人生三河 · 九页评审</title><style>body{margin:32px;background:#eee;color:#333;font-family:Microsoft YaHei,sans-serif}main{display:grid;grid-template-columns:repeat(3,390px);gap:40px}h1{font-size:26px}h2{font-size:16px}svg{box-shadow:0 3px 15px #0001}</style><h1>人生三河 · 阶段7B</h1><p>灰度低保真 · 分数均为示例 · 页面跳转说明见《页面结构说明》</p><main><section><h2>01 建立我的护城河</h2><svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 1</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 分析结果</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">建立我的护城河</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">把这张地图留下来，慢慢把它养起来。</text><g id="区块-173"><rect x="24" y="173" width="342" height="113" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="202" font-size="16" font-weight="600" fill="#333">一起保存，继续建设</text><text x="40" y="230" font-size="13" font-weight="400" fill="#333">以后可以调整方向、推进里程碑、记录成果，</text><text x="40" y="255" font-size="13" font-weight="400" fill="#333">看看自己的三条河怎样变化。</text></g><g id="区块-308"><rect x="24" y="308" width="342" height="204" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="337" font-size="16" font-weight="600" fill="#333">保存内容</text><text x="40" y="365" font-size="13" font-weight="400" fill="#333">☑ 三河分析结果</text><text x="40" y="390" font-size="13" font-weight="400" fill="#333">☑ 已确认的能力与经历</text><text x="40" y="415" font-size="13" font-weight="400" fill="#333">☑ 未来路径</text><text x="40" y="440" font-size="13" font-weight="400" fill="#333">☑ 护城河计划</text><text x="40" y="465" font-size="13" font-weight="400" fill="#333">□ 本次完整探索记录（可选）</text></g><g id="区块-532"><rect x="24" y="532" width="342" height="139" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="561" font-size="16" font-weight="600" fill="#333">隐私由你决定</text><text x="40" y="589" font-size="13" font-weight="400" fill="#333">收入、财务缓冲等敏感内容可跳过。</text><text x="40" y="614" font-size="13" font-weight="400" fill="#333">默认只保存必要摘要，不保存敏感原文。</text><text x="40" y="639" font-size="13" font-weight="400" fill="#333">沿用你此前的保存选择。　调整保存范围 ›</text></g><g id="按钮-704"><rect x="24" y="704" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="146" y="733" font-size="14" font-weight="600" fill="#fff">建立我的护城河</text></g><text x="24" y="780" font-size="12" font-weight="400" fill="#666">需要时，下一步完成登录并确认保存。</text><text x="24" y="801" font-size="12" font-weight="400" fill="#666">未登录或保存失败时，可返回继续调整。</text></g></svg></section><section><h2>02 我的河首页</h2><svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 2</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 返回</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">最近哪条河有新变化？</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">每一点进展，都可以在这里留下痕迹。</text><g id="区块-174"><rect x="24" y="174" width="342" height="166" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="203" font-size="16" font-weight="600" fill="#333">我的三河</text><text x="40" y="231" font-size="13" font-weight="400" fill="#333">生存河　72%　↑ 2 个百分点</text><text x="40" y="256" font-size="13" font-weight="400" fill="#333">韧性河　51%　↑ 3 个百分点</text><text x="40" y="281" font-size="13" font-weight="400" fill="#333">意义河　67%　持平</text><text x="40" y="306" font-size="13" font-weight="400" fill="#333">较上一次有效更新　　查看判断依据 ›</text></g><g id="区块-359"><rect x="24" y="359" width="342" height="100" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="388" font-size="16" font-weight="600" fill="#333">当前最值得建设 · 证明资本</text><text x="40" y="416" font-size="13" font-weight="400" fill="#333">当前 46%　　　　　　　　目标 60%</text></g><rect x="40" y="431" width="310" height="6" rx="3" fill="#e5e5e5" stroke="#e5e5e5"/><rect x="40" y="431" width="143" height="6" rx="3" fill="#777" stroke="#777"/><g id="区块-479"><rect x="24" y="479" width="342" height="113" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="508" font-size="16" font-weight="600" fill="#333">下一里程碑</text><text x="40" y="536" font-size="13" font-weight="400" fill="#333">完成五次目标用户访谈　　　　3 / 5</text><text x="40" y="561" font-size="13" font-weight="400" fill="#333">关联：证明资本、能力资本</text></g><g id="按钮-611"><rect x="24" y="611" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="111" y="640" font-size="14" font-weight="600" fill="#fff">继续推进 · 查看里程碑</text></g><g id="区块-680"><rect x="24" y="680" width="342" height="111" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="709" font-size="16" font-weight="600" fill="#333">最近变化</text><text x="40" y="737" font-size="13" font-weight="400" fill="#333">新增成果证明一份 · 完成里程碑一个</text><text x="40" y="762" font-size="13" font-weight="400" fill="#333">韧性河提升 3 个百分点</text></g><g id="按钮-817"><rect x="24" y="817" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="132" y="846" font-size="14" font-weight="600" fill="#333">＋ 记录一个新进展</text></g><g id="底部导航"><rect x="0" y="978" width="390" height="62" rx="0" fill="#fff" stroke="#ddd"/><text x="16" y="1014" font-size="12" font-weight="600" fill="#222">我的河</text><text x="114" y="1014" font-size="12" font-weight="400" fill="#888">未来路径</text><text x="212" y="1014" font-size="12" font-weight="400" fill="#888">护城河计划</text><text x="310" y="1014" font-size="12" font-weight="400" fill="#888">我的</text></g></g></svg></section><section><h2>03 未来路径列表</h2><svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 3</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 返回</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">未来不需要一次选死</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">把值得考虑的路放在这里，慢慢验证。</text><text x="24" y="170" font-size="12" font-weight="400" fill="#666">由人工智能初始化，你可以持续调整。</text><g id="区块-194"><rect x="24" y="194" width="342" height="142" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="223" font-size="16" font-weight="600" fill="#333">人工智能产品经理 · 重点探索</text><text x="40" y="251" font-size="13" font-weight="400" fill="#333">资本复用 81%　　意义匹配 84%</text><text x="40" y="276" font-size="13" font-weight="400" fill="#333">已有相关能力，证明资本还需加强。</text><text x="40" y="301" font-size="13" font-weight="400" fill="#333">查看路径 ›</text></g><g id="区块-353"><rect x="24" y="353" width="342" height="142" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="382" font-size="16" font-weight="600" fill="#333">独立开发 · 低成本探索</text><text x="40" y="410" font-size="13" font-weight="400" fill="#333">资本复用 63%　　意义匹配 91%</text><text x="40" y="435" font-size="13" font-weight="400" fill="#333">先用小项目检验兴趣与投入。</text><text x="40" y="460" font-size="13" font-weight="400" fill="#333">查看路径 ›</text></g><g id="区块-512"><rect x="24" y="512" width="342" height="142" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="541" font-size="16" font-weight="600" fill="#333">人工智能工程 · 暂时保留</text><text x="40" y="569" font-size="13" font-weight="400" fill="#333">资本复用 72%　　意义匹配 59%</text><text x="40" y="594" font-size="13" font-weight="400" fill="#333">保留方向，暂不安排推进任务。</text><text x="40" y="619" font-size="13" font-weight="400" fill="#333">查看路径 ›</text></g><g id="按钮-680"><rect x="24" y="680" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="139" y="709" font-size="14" font-weight="600" fill="#fff">＋ 新建一条路径</text></g><text x="24" y="752" font-size="12" font-weight="400" fill="#666">每条路径都支持编辑、暂停与删除。</text><text x="24" y="773" font-size="12" font-weight="400" fill="#666">指标的含义与依据可在路径详情中查看。</text><g id="底部导航"><rect x="0" y="978" width="390" height="62" rx="0" fill="#fff" stroke="#ddd"/><text x="16" y="1014" font-size="12" font-weight="400" fill="#888">我的河</text><text x="114" y="1014" font-size="12" font-weight="600" fill="#222">未来路径</text><text x="212" y="1014" font-size="12" font-weight="400" fill="#888">护城河计划</text><text x="310" y="1014" font-size="12" font-weight="400" fill="#888">我的</text></g></g></svg></section><section><h2>04 路径详情</h2><svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 4</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 未来路径</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">人工智能产品经理</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">重点探索　　　　　　　　　编辑路径 ›</text><g id="区块-171"><rect x="24" y="171" width="342" height="114" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="200" font-size="16" font-weight="600" fill="#333">为什么值得考虑</text><text x="40" y="228" font-size="13" font-weight="400" fill="#333">可复用你的人工智能技术理解、</text><text x="40" y="253" font-size="13" font-weight="400" fill="#333">项目实践和产品探索经验。</text></g><g id="区块-301"><rect x="24" y="301" width="342" height="141" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="330" font-size="16" font-weight="600" fill="#333">四个参考指标　　查看依据 ›</text><text x="40" y="358" font-size="13" font-weight="400" fill="#333">资本复用 81%　　意义匹配 84%</text><text x="40" y="383" font-size="13" font-weight="400" fill="#333">转换成本 42%　　当前准备度 68%</text><text x="40" y="408" font-size="13" font-weight="400" fill="#333">转换成本越低，所需新增投入越少。</text></g><g id="区块-458"><rect x="24" y="458" width="342" height="115" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="487" font-size="16" font-weight="600" fill="#333">已有积累与主要缺口</text><text x="40" y="515" font-size="13" font-weight="400" fill="#333">已有：技术理解、研究能力、独立项目经验</text><text x="40" y="540" font-size="13" font-weight="400" fill="#333">缺口：真实用户研究、商业结果、行业经验</text></g><g id="区块-589"><rect x="24" y="589" width="342" height="113" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="618" font-size="16" font-weight="600" fill="#333">先这样验证</text><text x="40" y="646" font-size="13" font-weight="400" fill="#333">完成五次目标用户访谈，整理需求结论。</text><text x="40" y="671" font-size="13" font-weight="400" fill="#333">再用一个小原型检验真实使用意愿。</text></g><g id="按钮-725"><rect x="24" y="725" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="132" y="754" font-size="14" font-weight="600" fill="#fff">为这条路径制定计划</text></g><g id="按钮-783"><rect x="24" y="783" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="146" y="812" font-size="14" font-weight="600" fill="#333">编辑或管理路径</text></g><text x="24" y="860" font-size="12" font-weight="400" fill="#666">人工智能先生成可编辑计划，确认后开始推进。</text><g id="底部导航"><rect x="0" y="978" width="390" height="62" rx="0" fill="#fff" stroke="#ddd"/><text x="16" y="1014" font-size="12" font-weight="400" fill="#888">我的河</text><text x="114" y="1014" font-size="12" font-weight="600" fill="#222">未来路径</text><text x="212" y="1014" font-size="12" font-weight="400" fill="#888">护城河计划</text><text x="310" y="1014" font-size="12" font-weight="400" fill="#888">我的</text></g></g></svg></section><section><h2>05 新建或编辑路径</h2><svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 5</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 路径详情</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">新建 / 编辑路径</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">先写下方向，之后随时可以调整。</text><g id="区块-175"><rect x="24" y="175" width="342" height="86" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="204" font-size="16" font-weight="600" fill="#333">路径名称 *</text><text x="40" y="232" font-size="13" font-weight="400" fill="#333">人工智能产品经理</text></g><g id="区块-276"><rect x="24" y="276" width="342" height="88" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="305" font-size="16" font-weight="600" fill="#333">为什么想试试（可选）</text><text x="40" y="333" font-size="13" font-weight="400" fill="#333">希望把技术理解变成有人使用的产品。</text></g><g id="区块-379"><rect x="24" y="379" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="408" font-size="16" font-weight="600" fill="#333">探索状态</text><text x="40" y="436" font-size="13" font-weight="400" fill="#333">● 重点探索　　○ 低成本探索</text><text x="40" y="461" font-size="13" font-weight="400" fill="#333">○ 暂时保留　　○ 已暂停</text></g><g id="区块-506"><rect x="24" y="506" width="342" height="89" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="535" font-size="16" font-weight="600" fill="#333">准备怎样验证（可选）</text><text x="40" y="563" font-size="13" font-weight="400" fill="#333">完成五次访谈，再制作一个小原型。</text></g><text x="24" y="621" font-size="12" font-weight="400" fill="#666">可用人工智能补充建议，再自行修改。</text><text x="24" y="642" font-size="12" font-weight="400" fill="#666">个人收入等敏感信息无需填写。</text><g id="按钮-675"><rect x="24" y="675" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="167" y="704" font-size="14" font-weight="600" fill="#fff">保存路径</text></g><g id="按钮-733"><rect x="24" y="733" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="132" y="762" font-size="14" font-weight="600" fill="#333">请人工智能补充建议</text></g><g id="区块-807"><rect x="24" y="807" width="342" height="111" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="836" font-size="16" font-weight="600" fill="#333">管理已有路径</text><text x="40" y="864" font-size="13" font-weight="400" fill="#333">暂停路径　›　保留记录，暂停推进提醒</text><text x="40" y="889" font-size="13" font-weight="400" fill="#333">删除路径　›　确认后删除，成果证明保留</text></g><text x="24" y="947" font-size="12" font-weight="400" fill="#666">新建时不显示管理区；返回未保存时提示保留草稿。</text></g></svg></section><section><h2>06 护城河计划首页</h2><svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 6</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 返回</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">护城河计划</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">把想走的路，拆成走得动的小步。</text><g id="区块-172"><rect x="24" y="172" width="342" height="141" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="201" font-size="16" font-weight="600" fill="#333">人工智能产品经理</text><text x="40" y="229" font-size="13" font-weight="400" fill="#333">人工智能已生成初稿，可持续编辑。</text><text x="40" y="254" font-size="13" font-weight="400" fill="#333">建设重点：证明资本　46% → 60%</text><text x="40" y="279" font-size="13" font-weight="400" fill="#333">目标是建设方向，不保证分数提升。</text></g><text x="24" y="345" font-size="16" font-weight="600" fill="#333">里程碑　　　　　　　　　编辑计划 ›</text><g id="区块-365"><rect x="24" y="365" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="394" font-size="16" font-weight="600" fill="#333">一 · 完成五次目标用户访谈</text><text x="40" y="422" font-size="13" font-weight="400" fill="#333">进行中　3 / 5　　　　　　查看详情 ›</text><text x="40" y="447" font-size="13" font-weight="400" fill="#333">关联：证明资本、能力资本</text></g><g id="区块-491"><rect x="24" y="491" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="520" font-size="16" font-weight="600" fill="#333">二 · 制作并测试一个小原型</text><text x="40" y="548" font-size="13" font-weight="400" fill="#333">待开始　　　　　　　　　编辑 ›</text><text x="40" y="573" font-size="13" font-weight="400" fill="#333">完成访谈后，调整原型范围。</text></g><g id="区块-617"><rect x="24" y="617" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="646" font-size="16" font-weight="600" fill="#333">三 · 整理一份可展示的案例</text><text x="40" y="674" font-size="13" font-weight="400" fill="#333">待开始　　　　　　　　　编辑 ›</text><text x="40" y="699" font-size="13" font-weight="400" fill="#333">用过程与结果说明自己的贡献。</text></g><g id="按钮-754"><rect x="24" y="754" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="146" y="783" font-size="14" font-weight="600" fill="#fff">继续当前里程碑</text></g><g id="按钮-813"><rect x="24" y="813" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="111" y="842" font-size="14" font-weight="600" fill="#333">编辑计划 / 添加里程碑</text></g><text x="24" y="889" font-size="12" font-weight="400" fill="#666">可调整目标、时间与里程碑顺序。</text><text x="24" y="910" font-size="12" font-weight="400" fill="#666">初次生成时，主按钮为「确认计划并开始」。</text><g id="底部导航"><rect x="0" y="978" width="390" height="62" rx="0" fill="#fff" stroke="#ddd"/><text x="16" y="1014" font-size="12" font-weight="400" fill="#888">我的河</text><text x="114" y="1014" font-size="12" font-weight="400" fill="#888">未来路径</text><text x="212" y="1014" font-size="12" font-weight="600" fill="#222">护城河计划</text><text x="310" y="1014" font-size="12" font-weight="400" fill="#888">我的</text></g></g></svg></section><section><h2>07 里程碑详情</h2><svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 7</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 护城河计划</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">完成五次目标用户访谈</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">进行中　　　　　　　　　编辑里程碑 ›</text><g id="区块-175"><rect x="24" y="175" width="342" height="113" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="204" font-size="16" font-weight="600" fill="#333">这一步要完成什么</text><text x="40" y="232" font-size="13" font-weight="400" fill="#333">了解真实需求，整理一份访谈结论。</text><text x="40" y="257" font-size="13" font-weight="400" fill="#333">完成标准：五次访谈 + 一份结论摘要。</text></g><g id="区块-304"><rect x="24" y="304" width="342" height="164" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="333" font-size="16" font-weight="600" fill="#333">当前进度　3 / 5</text><text x="40" y="361" font-size="13" font-weight="400" fill="#333">☑ 已完成三次访谈</text><text x="40" y="386" font-size="13" font-weight="400" fill="#333">□ 完成剩余两次访谈</text><text x="40" y="411" font-size="13" font-weight="400" fill="#333">□ 整理结论摘要</text><text x="40" y="436" font-size="13" font-weight="400" fill="#333">调整进度 ›　　目标日期：九月十四日</text></g><g id="区块-485"><rect x="24" y="485" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="514" font-size="16" font-weight="600" fill="#333">关联资本</text><text x="40" y="542" font-size="13" font-weight="400" fill="#333">证明资本 · 能力资本</text><text x="40" y="567" font-size="13" font-weight="400" fill="#333">实际关联将在添加成果后由你确认。</text></g><g id="区块-615"><rect x="24" y="615" width="342" height="86" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="644" font-size="16" font-weight="600" fill="#333">已有成果证明</text><text x="40" y="672" font-size="13" font-weight="400" fill="#333">访谈摘要（一）　　　　　　查看 ›</text></g><g id="按钮-725"><rect x="24" y="725" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="153" y="754" font-size="14" font-weight="600" fill="#fff">添加成果证明</text></g><g id="按钮-784"><rect x="24" y="784" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="118" y="813" font-size="14" font-weight="600" fill="#333">编辑内容 / 调整日期</text></g><text x="24" y="860" font-size="12" font-weight="400" fill="#666">达到完成标准后，可标记里程碑完成。</text><text x="24" y="881" font-size="12" font-weight="400" fill="#666">完成任务本身不会直接增加三河分数。</text><g id="底部导航"><rect x="0" y="978" width="390" height="62" rx="0" fill="#fff" stroke="#ddd"/><text x="16" y="1014" font-size="12" font-weight="400" fill="#888">我的河</text><text x="114" y="1014" font-size="12" font-weight="400" fill="#888">未来路径</text><text x="212" y="1014" font-size="12" font-weight="600" fill="#222">护城河计划</text><text x="310" y="1014" font-size="12" font-weight="400" fill="#888">我的</text></g></g></svg></section><section><h2>08 添加成果证明</h2><svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 8</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 里程碑</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">添加成果证明</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">把你做过的事情，变成看得见的积累。</text><g id="区块-174"><rect x="24" y="174" width="342" height="165" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="203" font-size="16" font-weight="600" fill="#333">第一步 · 记录成果</text><text x="40" y="231" font-size="13" font-weight="400" fill="#333">成果名称 *　五次目标用户访谈与结论</text><text x="40" y="256" font-size="13" font-weight="400" fill="#333">成果摘要 *　完成五次访谈，提炼三项需求。</text><text x="40" y="281" font-size="13" font-weight="400" fill="#333">链接 / 附件（可选）　＋ 添加</text><text x="40" y="306" font-size="13" font-weight="400" fill="#333">关联里程碑　完成五次目标用户访谈 ›</text></g><text x="24" y="363" font-size="12" font-weight="400" fill="#666">默认仅保存摘要；附件由你主动选择。</text><text x="24" y="384" font-size="12" font-weight="400" fill="#666">请先移除姓名、联系方式等第三方敏感信息。</text><g id="按钮-410"><rect x="24" y="410" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="118" y="439" font-size="14" font-weight="600" fill="#333">请人工智能识别关联资本</text></g><g id="区块-475"><rect x="24" y="475" width="342" height="169" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="504" font-size="16" font-weight="600" fill="#333">第二步 · 确认识别建议</text><text x="40" y="532" font-size="13" font-weight="400" fill="#333">☑ 证明资本　有可核验的访谈结论</text><text x="40" y="557" font-size="13" font-weight="400" fill="#333">☑ 能力资本　体现用户研究与归纳能力</text><text x="40" y="582" font-size="13" font-weight="400" fill="#333">修改关联资本 ›　　补充 / 取消勾选</text><text x="40" y="607" font-size="13" font-weight="400" fill="#333">依据：本次成果摘要与已选材料</text></g><text x="24" y="670" font-size="12" font-weight="400" fill="#666">此区在识别后出现；识别结果尚未计入评分。</text><text x="24" y="691" font-size="12" font-weight="400" fill="#666">识别失败时，可重试或手动选择关联资本。</text><g id="按钮-726"><rect x="24" y="726" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="132" y="755" font-size="14" font-weight="600" fill="#fff">确认关联并更新三河</text></g><text x="24" y="802" font-size="12" font-weight="400" fill="#666">确认后保存成果，由评分系统重新计算。</text><text x="24" y="823" font-size="12" font-weight="400" fill="#666">计算期间显示处理中；失败后可重试。</text><text x="24" y="844" font-size="12" font-weight="400" fill="#666">也可以先保存草稿，之后再确认。</text><g id="按钮-889"><rect x="24" y="889" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="167" y="918" font-size="14" font-weight="600" fill="#333">保存草稿</text></g></g></svg></section><section><h2>09 三河更新反馈</h2><svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 9</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 成果证明</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">这份进展，已经记下来了</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">成果已保存，三河已完成更新。</text><g id="区块-175"><rect x="24" y="175" width="342" height="139" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="204" font-size="16" font-weight="600" fill="#333">本次成果</text><text x="40" y="232" font-size="13" font-weight="400" fill="#333">五次目标用户访谈与结论</text><text x="40" y="257" font-size="13" font-weight="400" fill="#333">你已确认：证明资本、能力资本</text><text x="40" y="282" font-size="13" font-weight="400" fill="#333">已计入本次更新　　查看成果 ›</text></g><g id="区块-331"><rect x="24" y="331" width="342" height="142" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="360" font-size="16" font-weight="600" fill="#333">三河变化</text><text x="40" y="388" font-size="13" font-weight="400" fill="#333">生存河　72% → 72%　持平</text><text x="40" y="413" font-size="13" font-weight="400" fill="#333">韧性河　51% → 53%　↑ 2 个百分点</text><text x="40" y="438" font-size="13" font-weight="400" fill="#333">意义河　67% → 67%　持平</text></g><g id="区块-490"><rect x="24" y="490" width="342" height="164" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="519" font-size="16" font-weight="600" fill="#333">这次更新说明了什么</text><text x="40" y="547" font-size="13" font-weight="400" fill="#333">访谈结论补充了可核验成果，</text><text x="40" y="572" font-size="13" font-weight="400" fill="#333">提升了证明资本对应的评估。</text><text x="40" y="597" font-size="13" font-weight="400" fill="#333">生存河与意义河暂未出现有效变化。</text><text x="40" y="622" font-size="13" font-weight="400" fill="#333">查看本次评分依据 ›</text></g><g id="区块-671"><rect x="24" y="671" width="342" height="112" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="700" font-size="16" font-weight="600" fill="#333">接下来的一小步</text><text x="40" y="728" font-size="13" font-weight="400" fill="#333">访谈里程碑已完成。</text><text x="40" y="753" font-size="13" font-weight="400" fill="#333">下一步：制作并测试一个小原型。</text></g><g id="按钮-809"><rect x="24" y="809" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="160" y="838" font-size="14" font-weight="600" fill="#fff">回到我的河</text></g><g id="按钮-868"><rect x="24" y="868" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="146" y="897" font-size="14" font-weight="600" fill="#333">查看下一里程碑</text></g><text x="24" y="946" font-size="12" font-weight="400" fill="#666">每份成果都能留下记录；分数也可能保持不变。</text></g></svg></section></main></html>
