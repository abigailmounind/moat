<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 2</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 返回</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">最近哪条河有新变化？</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">每一点进展，都可以在这里留下痕迹。</text><g id="区块-174"><rect x="24" y="174" width="342" height="166" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="203" font-size="16" font-weight="600" fill="#333">我的三河</text><text x="40" y="231" font-size="13" font-weight="400" fill="#333">生存河　72%　↑ 2 个百分点</text><text x="40" y="256" font-size="13" font-weight="400" fill="#333">韧性河　51%　↑ 3 个百分点</text><text x="40" y="281" font-size="13" font-weight="400" fill="#333">意义河　67%　持平</text><text x="40" y="306" font-size="13" font-weight="400" fill="#333">较上一次有效更新　　查看判断依据 ›</text></g><g id="区块-359"><rect x="24" y="359" width="342" height="100" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="388" font-size="16" font-weight="600" fill="#333">当前最值得建设 · 证明资本</text><text x="40" y="416" font-size="13" font-weight="400" fill="#333">当前 46%　　　　　　　　目标 60%</text></g><rect x="40" y="431" width="310" height="6" rx="3" fill="#e5e5e5" stroke="#e5e5e5"/><rect x="40" y="431" width="143" height="6" rx="3" fill="#777" stroke="#777"/><g id="区块-479"><rect x="24" y="479" width="342" height="113" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="508" font-size="16" font-weight="600" fill="#333">下一里程碑</text><text x="40" y="536" font-size="13" font-weight="400" fill="#333">完成五次目标用户访谈　　　　3 / 5</text><text x="40" y="561" font-size="13" font-weight="400" fill="#333">关联：证明资本、能力资本</text></g><g id="按钮-611"><rect x="24" y="611" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="111" y="640" font-size="14" font-weight="600" fill="#fff">继续推进 · 查看里程碑</text></g><g id="区块-680"><rect x="24" y="680" width="342" height="111" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="709" font-size="16" font-weight="600" fill="#333">最近变化</text><text x="40" y="737" font-size="13" font-weight="400" fill="#333">新增成果证明一份 · 完成里程碑一个</text><text x="40" y="762" font-size="13" font-weight="400" fill="#333">韧性河提升 3 个百分点</text></g><g id="按钮-817"><rect x="24" y="817" width="342" height="46" rx="12" fill="#fff" stroke="#333"/><text x="132" y="846" font-size="14" font-weight="600" fill="#333">＋ 记录一个新进展</text></g><g id="底部导航"><rect x="0" y="978" width="390" height="62" rx="0" fill="#fff" stroke="#ddd"/><text x="16" y="1014" font-size="12" font-weight="600" fill="#222">我的河</text><text x="114" y="1014" font-size="12" font-weight="400" fill="#888">未来路径</text><text x="212" y="1014" font-size="12" font-weight="400" fill="#888">护城河计划</text><text x="310" y="1014" font-size="12" font-weight="400" fill="#888">我的</text></g></g></svg>