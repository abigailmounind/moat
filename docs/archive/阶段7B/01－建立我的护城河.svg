<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040"><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="390" height="1040" rx="0" fill="#fafafa" stroke="#bbb"/><text x="24" y="30" font-size="12" font-weight="600" fill="#333">人生三河</text><text x="300" y="30" font-size="10" font-weight="400" fill="#333">阶段七乙 · 1</text><text x="24" y="70" font-size="13" font-weight="400" fill="#333">‹ 分析结果</text><text x="24" y="113" font-size="25" font-weight="600" fill="#333">建立我的护城河</text><text x="24" y="142" font-size="13" font-weight="400" fill="#666">把这张地图留下来，慢慢把它养起来。</text><g id="区块-173"><rect x="24" y="173" width="342" height="113" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="202" font-size="16" font-weight="600" fill="#333">一起保存，继续建设</text><text x="40" y="230" font-size="13" font-weight="400" fill="#333">以后可以调整方向、推进里程碑、记录成果，</text><text x="40" y="255" font-size="13" font-weight="400" fill="#333">看看自己的三条河怎样变化。</text></g><g id="区块-308"><rect x="24" y="308" width="342" height="204" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="337" font-size="16" font-weight="600" fill="#333">保存内容</text><text x="40" y="365" font-size="13" font-weight="400" fill="#333">☑ 三河分析结果</text><text x="40" y="390" font-size="13" font-weight="400" fill="#333">☑ 已确认的能力与经历</text><text x="40" y="415" font-size="13" font-weight="400" fill="#333">☑ 未来路径</text><text x="40" y="440" font-size="13" font-weight="400" fill="#333">☑ 护城河计划</text><text x="40" y="465" font-size="13" font-weight="400" fill="#333">□ 本次完整探索记录（可选）</text></g><g id="区块-532"><rect x="24" y="532" width="342" height="139" rx="12" fill="#fff" stroke="#d5d5d5"/><text x="40" y="561" font-size="16" font-weight="600" fill="#333">隐私由你决定</text><text x="40" y="589" font-size="13" font-weight="400" fill="#333">收入、财务缓冲等敏感内容可跳过。</text><text x="40" y="614" font-size="13" font-weight="400" fill="#333">默认只保存必要摘要，不保存敏感原文。</text><text x="40" y="639" font-size="13" font-weight="400" fill="#333">沿用你此前的保存选择。　调整保存范围 ›</text></g><g id="按钮-704"><rect x="24" y="704" width="342" height="46" rx="12" fill="#333" stroke="#333"/><text x="146" y="733" font-size="14" font-weight="600" fill="#fff">建立我的护城河</text></g><text x="24" y="780" font-size="12" font-weight="400" fill="#666">需要时，下一步完成登录并确认保存。</text><text x="24" y="801" font-size="12" font-weight="400" fill="#666">未登录或保存失败时，可返回继续调整。</text></g></svg>