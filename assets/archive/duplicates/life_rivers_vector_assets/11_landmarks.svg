<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">

<defs>
  <linearGradient id="riverGrad" x1="0" x2="1">
    <stop offset="0%" stop-color="#2A7185" stop-opacity="0.96"/>
    <stop offset="100%" stop-color="#7EA9B1" stop-opacity="0.96"/>
  </linearGradient>
  <radialGradient id="mistGrad">
    <stop offset="0%" stop-color="#B8A9C7" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#F7F1E7" stop-opacity="0"/>
  </radialGradient>
</defs>


<!-- trees -->
<g transform="translate(90,220)">
  <rect x="35" y="95" width="12" height="55" fill="#A79C8B"/>
  <circle cx="40" cy="70" r="36" fill="#7F9074"/>
  <circle cx="18" cy="92" r="28" fill="#7F9074" opacity="0.9"/>
</g>
<!-- shelter -->
<g transform="translate(260,210)">
  <rect x="0" y="70" width="100" height="80" rx="8" fill="#F4C1B2"/>
  <polygon points="-10,70 50,20 110,70" fill="#EAA08B"/>
  <rect x="38" y="100" width="24" height="50" fill="#F7F1E7"/>
</g>
<!-- flag -->
<g transform="translate(480,190)">
  <line x1="20" y1="30" x2="20" y2="160" stroke="#35535B" stroke-width="8"/>
  <path d="M20 35 L95 55 L20 85 Z" fill="#EAA08B"/>
</g>
<!-- mountain -->
<g transform="translate(650,215)">
  <polygon points="0,150 80,25 160,150" fill="#B8A9C7" opacity="0.55"/>
  <polygon points="70,40 80,25 90,40 80,56" fill="#F7F1E7"/>
</g>
<!-- destination -->
<g transform="translate(890,210)">
  <circle cx="80" cy="80" r="54" fill="none" stroke="#2A7185" stroke-width="10"/>
  <circle cx="80" cy="80" r="24" fill="#EAA08B"/>
  <circle cx="80" cy="80" r="6" fill="#F7F1E7"/>
</g>

</svg>